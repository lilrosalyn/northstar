trigger.description = "The trigger for this profile. (ex. `@Partners Ping` to trigger a partnership, `@everyone` for siblings, etc.)"
message.name = "Message"
message.description = "The message sent when a partnership is made."

[modules.verification]
code.name = "Code"
code.description = "The password people must enter to verify."
message.name = "Message"
message.description = "The message sent for people to verify with."
verifiedMessage.name = "Verified Message"
