message.name = "Message"
message.description = "The message sent when a member joins the server."

[modules.lock]
role.name = "Role"
role.description = "The role which is prevented from using the channel (usually a member role.)"
locked.name = "Locked Message"
locked.description = "The message sent when the channel is locked."
unlocked.name = "Unlocked Message"
