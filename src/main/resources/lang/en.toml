[modules.roleplay]
channels.name = "Channels"
channels.description = "An exclusive list of channels where the roleplay feature can be used. Leave empty to allow use in all channels."

[modules.partnerships]
profiles.name = "Profiles"
profiles.description = "A list of profiles for each 'type' of partnership (partnerships, siblings, affiliates, etc.)"

[modules.partnershipsprofile]
channel.name = "Channel"
channel.description = "The channel where partnership messages are sent."
name.name = "Name"
name.description = "The name of this profile."
